name: Android

# Tests the Android shell and publishes an installable debug APK for every
# successful run. Manual runs additionally build an unsigned release AAB that
# can be downloaded and signed locally; signing keys never enter GitHub CI.

on:
  workflow_dispatch:
    inputs:
      version-code:
        description: "versionCode (must be higher than the last uploaded to Play; starts at 3)"
        required: true
        type: string
      version-name:
        description: "versionName shown to users (e.g. 0.2.0). Blank keeps the default in app/build.gradle.kts"
        required: false
        default: ""
      version-note:
        description: "Optional note appended to the artifact filename (e.g. rc1)"
        required: false
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/android-bundle.yml"
      - "web/android/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-bundle.yml"
      - "web/android/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/security-gate.yml

  build:
    name: Test and build APK
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/android

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Test, lint, and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: omnigent-android-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build release AAB
        if: github.event_name == 'workflow_dispatch'
        run: |
          ./gradlew bundleRelease --no-daemon --console=plain \
            "-PversionCode=${{ inputs.version-code }}" \
            "-PversionName=${{ inputs.version-name }}"

      - name: Verify AAB
        if: github.event_name == 'workflow_dispatch'
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::AAB not found at $AAB"; exit 1; }
          echo "AAB size: $(du -h "$AAB" | cut -f1)"

      - name: Upload AAB
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: omnigent-android-aab${{ inputs.version-note && format('-{0}', inputs.version-note) || '' }}
          path: web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
